name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Giá trị giả cho build/test: CI không dùng cơ sở dữ liệu thật.
  PAYLOAD_SECRET: ci-secret-not-for-production
  DATABASE_URI: postgres://ci:ci@localhost:5432/ci
  NEXT_PUBLIC_SITE_URL: https://mentorjennynguyen.com

jobs:
  verify:
    name: Lint, type-check, unit test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Cache build for e2e
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (sáng / tối / mobile)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (cảnh báo, chưa chặn)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npm start &
      - run: npx --yes wait-on http://localhost:3000 && npx --yes @lhci/cli@0.14 collect --url=http://localhost:3000/ --numberOfRuns=1 && npx --yes @lhci/cli@0.14 assert --assertions.categories:performance=warn --assertions.categories:seo=warn --assertions.categories:accessibility=warn --assertions.categories:best-practices=warn
